schema: spec-driven

context: |
  Python smart parking simulator with a Tkinter UI.
  Architecture separates core concurrency, simulation, and UI; main.py composes them.
  Current runtime: a spawn engine process owns ParkingLot and Simulator with
  task-oriented workers. Validated multiprocessing IPC carries commands,
  events and selected audit records. The parent transport forwards events to
  the local Tk queue and AuditSession owns the single parent file writer.
  FIFO among eligible requests with strict per-authorized-slot FIFO is approved;
  blocked slots do not prevent progress at other free authorized slots.
  Academic compliance must be assessed against concrete behavior and tests.
  SQLite is excluded. Audit confirmation means technical drain, not certification.
  Core owns admission, capacity, synchronization, and vehicle lifecycle.
  Generated technical artifacts use English.
  Downstream work pace: automatic. Delivery strategy: auto-chain.

strict_tdd: false

projects:
  - path: .
    stack: Python 3 / Tkinter (standard library)
    test_command: "python -m pytest"
    test_framework: pytest (repository contains tests; exact installed version not verified in this documentation update)
    test_layers:
      unit: tests/ contains test modules for authorizations, events, parking, lifecycle, simulation, audit logging, UI projection, shutdown, main, and fonts; coverage not verified here
      integration: present test modules exercise cross-component behavior; exact classification not verified here
      e2e: not classified in this documentation update
    coverage: not detected
    quality_tools:
      linter: not detected
      type_checker: not detected
      formatter: not detected

testing:
  strict_tdd: false
  reason: No explicit workspace-level command covering multiple projects is configured; the project-local pytest suite exists. Test coverage and exact layer classification were not verified in this documentation update.
  projects:
    - path: .
      test_command: "python -m pytest"
      framework: "pytest; installed version not verified in this documentation update"
      unit: "tests/ contains unit-oriented test modules; coverage not verified"
      integration: "cross-component test modules exist; exact classification not verified"
      e2e: "not classified in this documentation update"
      coverage: "not detected"
      linter: "not detected"
      type_checker: "not detected"
      formatter: "not detected"

rules:
  proposal:
    - Keep changes within the user-approved scope and existing module boundaries.
    - Include user impact and explicit out-of-scope items.
  spec:
    - State observable requirements and scenarios.
    - Preserve the shared core API and event contract unless change is explicitly approved.
  design:
    - Keep Tkinter out of core and keep all UI updates on the main thread.
    - Explain synchronization, shutdown, and race-safety decisions.
  tasks:
    - Break implementation and tests into reviewable tasks.
  apply:
    - Implement only approved tasks and verify with the detected project test command.
  verify:
    - Report executed checks and limitations honestly.
  archive:
    - Preserve change artifacts and sync only implemented behavior.
